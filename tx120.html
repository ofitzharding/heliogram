<!doctype html>
<html><head><meta charset="utf-8"><title>heliogram tx 120</title><style>
/* cursor:none on html/body alone does not cover the canvas in Safari, and a
   cursor parked over the code is opaque pixels sitting on payload cells. */
html,body,canvas,*{cursor:none !important}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
/* HUD is bright green over the code. Fine before the take, pollution during
   it, so it is hidden once the payload starts (press h to peek). */
#hud{position:fixed;left:10px;top:8px;color:#0f0;font:13px monospace;z-index:9}
#hud.mid{display:none}
#msg{position:fixed;left:0;right:0;top:45%;color:#fff;text-align:center;
     font:28px -apple-system,monospace;z-index:9}
</style></head><body>
<div id="hud"></div><div id="msg">loading…</div>
<canvas id="c"></canvas>
<script>
// 120Hz transmitter. One code frame per requestAnimationFrame tick.
//
// Every previous transmit went through a video file, and no player on this
// machine presents 120 distinct fps: ffplay fullscreen measured 58.4 fps on a
// 15.00s 120fps clip (it took 30.84s). The panel is 120Hz, so half the
// refreshes have always been wasted.
//
// Here the cells arrive as raw bits and are drawn with putImageData onto a
// gw x gh offscreen canvas, then scaled by an INTEGER factor with smoothing
// off. The backing store is in DEVICE pixels, so the result lands 1:1 on the
// panel with no compositor resampling and no video codec anywhere in the path.
// tx.html already measured this canvas route as the sharpest available here
// (0/1000 mid-band px, vs 19/1000 for ffplay fullscreen).
const q = new URLSearchParams(location.search);
const DIR   = q.get('dir')   || 'demo/webtx';
// PLAYLIST: dirs=a,b,c&segsec=45 plays each transmit for segsec seconds in
// one continuous session - one camera take answers every rung. The countdown
// runs once, over the FIRST segment's own frames, so the AE/AF lock carries
// through every rung unchanged.
const DIRS  = (q.get('dirs') || DIR).split(',');
const SEGSEC= +(q.get('segsec') || 45);
const LOOPS = +(q.get('loops') || 6);
const CD    = +(q.get('cd')    || 22);
// STROBE: draw code on even refreshes, full black on odd ones. The display
// becomes the shutter. Measured basis: straddle share predicts yield (frames
// at share 0.00-0.01 certify 89-100%, at 0.15-0.22 only 58-84%), and the SIC
// oracle showed a two-frame blend is unrecoverable (residual d' 0.04-1.20).
// With black insertion a boundary-straddling exposure integrates code+black
// instead of code_s + code_s+1. Black is not an interferer: it scales the
// photometry, and the local threshold adapts per cell. One-signal channel by
// transmit construction, at 60 distinct frames/s and the same 4K60 camera
// settings as every comparable take. Costs half the light; raise screen
// brightness. The panel holds 120Hz alternation (smear test: 0.3-1.8px).
const STROBE = q.get('strobe') === '1';

const c = document.getElementById('c'), hud = document.getElementById('hud');
const msg = document.getElementById('msg');
const ctx = c.getContext('2d', {alpha:false});
let segs = [];          // {meta, bits, off, offctx, img, scale, x0, y0}
let seg = 0;
let meta = null, bits = null, off = null, offctx = null, img = null;
let scale = 1, x0 = 0, y0 = 0;

function activate(i){
  seg = i;
  const s = segs[i];
  meta = s.meta; bits = s.bits; off = s.off; offctx = s.offctx; img = s.img;
  scale = s.scale; x0 = s.x0; y0 = s.y0;
}

function size(){
  c.width  = Math.round(innerWidth  * devicePixelRatio);
  c.height = Math.round(innerHeight * devicePixelRatio);
  ctx.imageSmoothingEnabled = false;
  for (const s of segs){
    // integer scale only: a fractional factor resamples the cell grid, which
    // is what destroyed the code in the windowed-ffplay take
    s.scale = Math.max(1, Math.floor(Math.min(c.width/s.meta.gw,
                                              c.height/s.meta.gh)));
    s.x0 = (c.width  - s.meta.gw*s.scale) >> 1;
    s.y0 = (c.height - s.meta.gh*s.scale) >> 1;
  }
  if (segs.length) activate(seg);
}

async function boot(){
  for (const d of DIRS){
    const m = await (await fetch(d + '/meta.json')).json();
    const buf = await (await fetch(d + '/frames.bin')).arrayBuffer();
    const o = document.createElement('canvas');
    o.width = m.gw; o.height = m.gh;
    const octx = o.getContext('2d', {alpha:false});
    segs.push({meta: m, bits: new Uint8Array(buf), off: o, offctx: octx,
               img: octx.createImageData(m.gw, m.gh),
               scale: 1, x0: 0, y0: 0});
  }
  size(); activate(0); addEventListener('resize', size);
  msg.textContent = 'click / press F for fullscreen, then hit record';
  addEventListener('keydown', e => {
    if (e.key === 'f' || e.key === 'F') document.documentElement.requestFullscreen();
    if (e.key === ' ') start();
    // peek at the rate mid-take without stopping; h toggles it back off
    if (e.key === 'h' || e.key === 'H') hud.classList.toggle('mid');
  });
  addEventListener('click', () => document.documentElement.requestFullscreen());
  document.addEventListener('fullscreenchange', () => {
    size();
    if (document.fullscreenElement){
      // Pointer lock is the only thing that reliably parks the cursor in
      // Safari fullscreen; cursor:none still flashes it on mouse movement,
      // and a flashed cursor is opaque pixels landing on payload cells.
      const el = document.documentElement;
      if (el.requestPointerLock) { try { el.requestPointerLock(); } catch(e){} }
      start();
    }
  });
}

function drawFrame(idx){
  const bpf = meta.bytes_per_frame, base = idx * bpf, d = img.data;
  const n = meta.gw * meta.gh;
  for (let i = 0; i < n; i++){
    // bit i of this frame, MSB-first (numpy packbits order)
    const v = (bits[base + (i >> 3)] >> (7 - (i & 7))) & 1 ? 255 : 0;
    const p = i << 2;
    d[p] = d[p+1] = d[p+2] = v; d[p+3] = 255;
  }
  offctx.putImageData(img, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(off, 0, 0, meta.gw, meta.gh,
                x0, y0, meta.gw*scale, meta.gh*scale);
}

let running = false, t0 = 0, shown = 0, loops = 0, fpsT = 0, fpsN = 0;
function start(){
  if (running) return;
  running = true; msg.style.display = 'none';
  t0 = performance.now(); fpsT = t0; shown = 0; loops = 0;
  requestAnimationFrame(tick);
}

let phase = 0;   // strobe phase: even = code, odd = black
function tick(){
  const now = performance.now();
  const cd = CD - (now - t0)/1000;
  if (STROBE && (phase++ & 1)){
    // dark half of the strobe cycle. Full black, no text: the countdown text
    // must strobe too, or the AE lock is taken against brighter frames than
    // the payload and the exposure comes out wrong for the code.
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, c.width, c.height);
    fpsN++;
    if (now - fpsT > 1000){
      const f = fpsN*1000/(now-fpsT);
      hud.textContent = `${c.width}x${c.height} strobe ${f.toFixed(1)}fps `
        + `loop ${loops+1}/${LOOPS}`
        + (f < 100 ? '  <-- BELOW 120, strobe is broken at this rate' : '');
      fpsN = 0; fpsT = now;
    }
    requestAnimationFrame(tick);
    return;
  }
  if (cd <= 0 && segs.length > 1){
    // playlist: advance to the segment this wall-clock second belongs to
    const want = Math.min(segs.length - 1,
                          Math.floor((now - t0 - CD*1000) / (SEGSEC*1000)));
    if (want !== seg){ activate(want); shown = 0; }
  }
  if (cd > 0){
    // Countdown over REAL code frames, so an AE/AF lock taken during it
    // carries over to the payload unchanged, and every lead frame still
    // advertises the correct file.
    drawFrame(shown % meta.frames);
    shown++;
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.font = `${Math.round(150*devicePixelRatio)}px -apple-system,monospace`;
    ctx.fillText(cd > 3 ? Math.ceil(cd) : 'HOLD STILL',
                 c.width/2, c.height/2);
    ctx.font = `${Math.round(26*devicePixelRatio)}px -apple-system,monospace`;
    ctx.fillText('TAP-HOLD TO LOCK AE/AF  -  do NOT touch the exposure slider',
                 c.width/2, c.height - 60*devicePixelRatio);
  } else {
    if (!hud.classList.contains('mid')) hud.classList.add('mid');
    const i = shown % meta.frames;
    drawFrame(i);
    shown++;
    if (segs.length > 1){
      // playlist end: SEGSEC per segment, DONE after the last
      if ((now - t0 - CD*1000) > SEGSEC*1000*segs.length){
        ctx.fillStyle='#000'; ctx.fillRect(0,0,c.width,c.height);
        ctx.fillStyle='#fff'; ctx.textAlign='center';
        ctx.font = `${Math.round(40*devicePixelRatio)}px -apple-system,monospace`;
        ctx.fillText('DONE - stop recording', c.width/2, c.height/2);
        return;
      }
    } else
    if (i === meta.frames - 1 && ++loops >= LOOPS){
      ctx.fillStyle='#000'; ctx.fillRect(0,0,c.width,c.height);
      ctx.fillStyle='#fff'; ctx.textAlign='center';
      ctx.font = `${Math.round(40*devicePixelRatio)}px -apple-system,monospace`;
      ctx.fillText('DONE - stop recording', c.width/2, c.height/2);
      hud.textContent += '  FINISHED';
      return;
    }
  }
  fpsN++;
  if (now - fpsT > 1000){
    const f = fpsN*1000/(now-fpsT);
    hud.textContent = `${c.width}x${c.height} dpr${devicePixelRatio} `
      + `x${scale} ${f.toFixed(1)}fps loop ${loops+1}/${LOOPS}`
      + (f < 100 ? '  <-- BELOW 120, take will be half rate' : '');
    fpsN = 0; fpsT = now;
  }
  requestAnimationFrame(tick);
}
boot();
</script></body></html>
